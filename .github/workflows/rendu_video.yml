name: Video Render CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install httpx

      - name: Check project structure
        run: |
          mkdir -p assets output temp
          ls -la
          ls -la assets
          ls -la output
          ls -la temp

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Check API startup
        run: |
          python -c "import main; print('OK')"

      - name: Upload generated MP4
        uses: actions/upload-artifact@v4
        with:
          name: quiz-video
          path: output/*.mp4
          if-no-files-found: error
